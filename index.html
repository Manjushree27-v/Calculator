<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glassmorphism Scientific DSA Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #203a72 0, #050b16 50%, #000 100%);
      color: #fff;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      z-index: -1;
    }

    .blob.blob1 {
      width: 300px;
      height: 300px;
      background: #4f8bff;
      top: -80px;
      left: -80px;
    }

    .blob.blob2 {
      width: 350px;
      height: 350px;
      background: #24ffc9;
      bottom: -120px;
      right: -100px;
    }

    .calculator-card {
      width: 340px;
      padding: 20px 24px 24px;
      border-radius: 28px;
      background: rgba(15, 26, 56, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(22px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.9;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .calc-header span:last-child {
      font-size: 11px;
      opacity: 0.7;
    }

    .display {
      height: 80px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(10, 19, 42, 0.8), rgba(18, 32, 70, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .display-expression {
      font-size: 13px;
      opacity: 0.7;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-value {
      font-size: 24px;
      text-align: right;
      font-weight: 600;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      border: none;
      outline: none;
      height: 46px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      color: #f1f5ff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease,
        border-color 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-operator {
      color: #7ad5ff;
    }

    .btn-func {
      color: #ffd27a;
      font-size: 13px;
    }

    .btn-accent {
      background: linear-gradient(135deg, #2e7bff, #2ef1ff);
      border: none;
      color: #020817;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(11, 132, 255, 0.5);
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #3d86ff, #43f2ff);
    }

    .btn-wide {
      grid-column: span 2;
    }

    .btn-small-text {
      font-size: 13px;
    }

    .footer-note {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="calculator-card">
    <div class="calc-header">
      <span>Sci DSA Calc</span>
      <span>Degrees mode</span>
    </div>

    <div class="display">
      <div id="expression" class="display-expression"></div>
      <div id="value" class="display-value">0</div>
    </div>

    <div class="buttons-grid">
      <!-- Scientific row 1 -->
      <button class="btn btn-func" data-func="sin">sin</button>
      <button class="btn btn-func" data-func="cos">cos</button>
      <button class="btn btn-func" data-func="tan">tan</button>
      <button class="btn btn-func" data-func="sqrt">√</button>

      <!-- Scientific row 2 -->
      <button class="btn btn-func" data-func="ln">ln</button>
      <button class="btn btn-func" data-func="log">log</button>
      <button class="btn btn-func" data-func="square">x²</button>
      <button class="btn btn-func" data-func="cube">x³</button>

      <!-- Row 3 -->
      <button class="btn btn-small-text" data-action="clear">AC</button>
      <button class="btn btn-small-text" data-action="backspace">⌫</button>
      <button class="btn btn-operator" data-value="(">(</button>
      <button class="btn btn-operator" data-value=")">)</button>

      <!-- Row 4 -->
      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn btn-operator" data-value="/">÷</button>

      <!-- Row 5 -->
      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn btn-operator" data-value="*">×</button>

      <!-- Row 6 -->
      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn btn-operator" data-value="-">−</button>

      <!-- Row 7 -->
      <button class="btn btn-wide" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn btn-operator" data-value="+">+</button>

      <!-- Row 8 -->
      <button class="btn" data-constant="3.141592653589793">π</button>
      <button class="btn" data-constant="2.718281828459045">e</button>
      <button class="btn btn-accent btn-wide" data-action="equals">=</button>
    </div>

    <div class="footer-note">
      Infix evaluation using stacks + scientific functions (sin, cos, tan, etc).
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById("expression");
    const valueEl = document.getElementById("value");
    const buttons = document.querySelectorAll(".btn");

    let currentExpr = "";

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const val = btn.getAttribute("data-value");
        const action = btn.getAttribute("data-action");
        const func = btn.getAttribute("data-func");
        const constant = btn.getAttribute("data-constant");

        if (action === "clear") {
          currentExpr = "";
          updateDisplay("0");
        } else if (action === "backspace") {
          currentExpr = currentExpr.slice(0, -1);
          updateDisplay(currentExpr || "0");
        } else if (action === "equals") {
          if (!currentExpr.trim()) return;
          try {
            const result = evaluateExpression(currentExpr);
            const formatted = formatResult(result);
            expressionEl.textContent = currentExpr;
            valueEl.textContent = formatted;
            currentExpr = String(formatted);
          } catch (err) {
            expressionEl.textContent = currentExpr;
            valueEl.textContent = "Error";
            console.error(err);
          }
        } else if (func) {
          applyFunction(func);
        } else if (constant) {
          currentExpr += constant;
          updateDisplay(currentExpr);
        } else if (val) {
          currentExpr += val;
          updateDisplay(currentExpr);
        }
      });
    });

    function updateDisplay(mainValue) {
      expressionEl.textContent = "";
      valueEl.textContent = mainValue;
    }

    function formatResult(num) {
      if (!Number.isFinite(num)) return "Error";
      const rounded = parseFloat(num.toFixed(8));
      return rounded.toString();
    }

    function toRadians(deg) {
      return (deg * Math.PI) / 180;
    }

    // Apply scientific function on current expression/result
    function applyFunction(func) {
      const baseExpr = currentExpr || valueEl.textContent || "0";

      try {
        const x = evaluateExpression(baseExpr);
        let result;

        switch (func) {
          case "sin":
            result = Math.sin(toRadians(x));
            break;
          case "cos":
            result = Math.cos(toRadians(x));
            break;
          case "tan":
            result = Math.tan(toRadians(x));
            break;
          case "sqrt":
            if (x < 0) throw new Error("Negative sqrt");
            result = Math.sqrt(x);
            break;
          case "ln":
            if (x <= 0) throw new Error("ln domain");
            result = Math.log(x);
            break;
          case "log":
            if (x <= 0) throw new Error("log domain");
            result = Math.log(x) / Math.LN10;
            break;
          case "square":
            result = x * x;
            break;
          case "cube":
            result = x * x * x;
            break;
          default:
            throw new Error("Unknown function");
        }

        const formatted = formatResult(result);
        expressionEl.textContent = func.toUpperCase() + "(" + baseExpr + ")";
        valueEl.textContent = formatted;
        currentExpr = String(formatted);
      } catch (err) {
        expressionEl.textContent = baseExpr;
        valueEl.textContent = "Error";
        console.error(err);
      }
    }

    // ---------- DSA PART: INFIX EVALUATION USING TWO STACKS ----------
    function evaluateExpression(expr) {
      const values = []; // numbers stack
      const ops = [];    // operators stack

      const precedence = (op) => {
        if (op === "+" || op === "-") return 1;
        if (op === "*" || op === "/") return 2;
        return 0;
      };

      const isOperatorChar = (ch) => "+-*/".includes(ch);

      const applyOp = (op, b, a) => {
        switch (op) {
          case "+": return a + b;
          case "-": return a - b;
          case "*": return a * b;
          case "/":
            if (b === 0) throw new Error("Division by zero");
            return a / b;
          default: throw new Error("Unknown operator " + op);
        }
      };

      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];

        if (ch === " ") {
          i++;
          continue;
        }

        // handle numbers (including unary minus, e.g. -5 or (-3))
        if ((ch >= "0" && ch <= "9") || ch === "." ||
            (ch === "-" && (i === 0 || expr[i - 1] === "(" || isOperatorChar(expr[i - 1])))) {
          let numStr = "";

          // unary minus
          if (ch === "-") {
            numStr += "-";
            i++;
          }

          while (
            i < expr.length &&
            ((expr[i] >= "0" && expr[i] <= "9") || expr[i] === ".")
          ) {
            numStr += expr[i];
            i++;
          }

          if (numStr === "-" || numStr === "" || numStr === ".") {
            throw new Error("Invalid number");
          }

          values.push(parseFloat(numStr));
          continue;
        }

        if (ch === "(") {
          ops.push(ch);
        } else if (ch === ")") {
          while (ops.length && ops[ops.length - 1] !== "(") {
            const op = ops.pop();
            const val2 = values.pop();
            const val1 = values.pop();
            values.push(applyOp(op, val2, val1));
          }
          if (!ops.length) throw new Error("Mismatched parentheses");
          ops.pop(); // remove "("
        } else if (isOperatorChar(ch)) {
          while (ops.length && precedence(ops[ops.length - 1]) >= precedence(ch)) {
            const op = ops.pop();
            const val2 = values.pop();
            const val1 = values.pop();
            values.push(applyOp(op, val2, val1));
          }
          ops.push(ch);
        } else {
          throw new Error("Invalid character: " + ch);
        }
        i++;
      }

      while (ops.length) {
        const op = ops.pop();
        const val2 = values.pop();
        const val1 = values.pop();
        values.push(applyOp(op, val2, val1));
      }

      if (values.length !== 1) {
        throw new Error("Invalid expression");
      }

      return values[0]; // raw number, rounded later
    }
  </script>
</body>
</html>
