<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glassmorphism DSA Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #203a72 0, #050b16 50%, #000 100%);
      color: #fff;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.6;
      z-index: -1;
    }

    .blob.blob1 {
      width: 300px;
      height: 300px;
      background: #4f8bff;
      top: -80px;
      left: -80px;
    }

    .blob.blob2 {
      width: 350px;
      height: 350px;
      background: #24ffc9;
      bottom: -120px;
      right: -100px;
    }

    .calculator-card {
      width: 320px;
      padding: 20px 24px 24px;
      border-radius: 28px;
      background: rgba(15, 26, 56, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(22px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.9;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .calc-header span:last-child {
      font-size: 11px;
      opacity: 0.7;
    }

    .display {
      height: 70px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(10, 19, 42, 0.8), rgba(18, 32, 70, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .display-expression {
      font-size: 13px;
      opacity: 0.7;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .display-value {
      font-size: 24px;
      text-align: right;
      font-weight: 600;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      border: none;
      outline: none;
      height: 48px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      color: #f1f5ff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s ease,
        border-color 0.2s ease;
      backdrop-filter: blur(12px);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.35);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-operator {
      color: #7ad5ff;
    }

    .btn-accent {
      background: linear-gradient(135deg, #2e7bff, #2ef1ff);
      border: none;
      color: #020817;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(11, 132, 255, 0.5);
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #3d86ff, #43f2ff);
    }

    .btn-wide {
      grid-column: span 2;
    }

    .btn-small-text {
      font-size: 13px;
    }

    .footer-note {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="calculator-card">
    <div class="calc-header">
      <span>DSA Calculator</span>
      <span>Glass UI</span>
    </div>

    <div class="display">
      <div id="expression" class="display-expression"></div>
      <div id="value" class="display-value">0</div>
    </div>

    <div class="buttons-grid">
      <button class="btn btn-small-text" data-action="clear">AC</button>
      <button class="btn btn-small-text" data-action="backspace">⌫</button>
      <button class="btn btn-operator" data-value="(">(</button>
      <button class="btn btn-operator" data-value=")">)</button>

      <button class="btn" data-value="7">7</button>
      <button class="btn" data-value="8">8</button>
      <button class="btn" data-value="9">9</button>
      <button class="btn btn-operator" data-value="/">÷</button>

      <button class="btn" data-value="4">4</button>
      <button class="btn" data-value="5">5</button>
      <button class="btn" data-value="6">6</button>
      <button class="btn btn-operator" data-value="*">×</button>

      <button class="btn" data-value="1">1</button>
      <button class="btn" data-value="2">2</button>
      <button class="btn" data-value="3">3</button>
      <button class="btn btn-operator" data-value="-">−</button>

      <button class="btn btn-wide" data-value="0">0</button>
      <button class="btn" data-value=".">.</button>
      <button class="btn btn-operator" data-value="+">+</button>

      <button class="btn btn-accent btn-wide" data-action="equals">=</button>
    </div>

    <div class="footer-note">
      Uses stacks to evaluate expressions (no <code>eval()</code>).
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById("expression");
    const valueEl = document.getElementById("value");
    const buttons = document.querySelectorAll(".btn");

    let currentExpr = "";

    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const val = btn.getAttribute("data-value");
        const action = btn.getAttribute("data-action");

        if (action === "clear") {
          currentExpr = "";
          updateDisplay("0");
        } else if (action === "backspace") {
          currentExpr = currentExpr.slice(0, -1);
          updateDisplay(currentExpr || "0");
        } else if (action === "equals") {
          if (!currentExpr.trim()) return;
          try {
            const result = evaluateExpression(currentExpr);
            expressionEl.textContent = currentExpr;
            valueEl.textContent = result;
            currentExpr = String(result);
          } catch (err) {
            expressionEl.textContent = currentExpr;
            valueEl.textContent = "Error";
            console.error(err);
          }
        } else if (val) {
          currentExpr += val;
          updateDisplay(currentExpr);
        }
      });
    });

    function updateDisplay(mainValue) {
      expressionEl.textContent = "";
      valueEl.textContent = mainValue;
    }

    function evaluateExpression(expr) {
      const values = [];
      const ops = [];

      const precedence = (op) => {
        if (op === "+" || op === "-") return 1;
        if (op === "*" || op === "/") return 2;
        return 0;
      };

      const applyOp = (op, b, a) => {
        switch (op) {
          case "+": return a + b;
          case "-": return a - b;
          case "*": return a * b;
          case "/":
            if (b === 0) throw new Error("Division by zero");
            return a / b;
          default: throw new Error("Unknown operator " + op);
        }
      };

      let i = 0;
      while (i < expr.length) {
        const ch = expr[i];

        if (ch === " ") {
          i++;
          continue;
        }

        if ((ch >= "0" && ch <= "9") || ch === ".") {
          let numStr = "";
          while (
            i < expr.length &&
            (((expr[i] >= "0" && expr[i] <= "9") || expr[i] === "."))
          ) {
            numStr += expr[i];
            i++;
          }
          values.push(parseFloat(numStr));
          continue;
        }

        if (ch === "(") {
          ops.push(ch);
        } else if (ch === ")") {
          while (ops.length && ops[ops.length - 1] !== "(") {
            const op = ops.pop();
            const val2 = values.pop();
            const val1 = values.pop();
            values.push(applyOp(op, val2, val1));
          }
          if (!ops.length) throw new Error("Mismatched parentheses");
          ops.pop();
        } else if ("+-*/".includes(ch)) {
          while (
            ops.length &&
            precedence(ops[ops.length - 1]) >= precedence(ch)
          ) {
            const op = ops.pop();
            const val2 = values.pop();
            const val1 = values.pop();
            values.push(applyOp(op, val2, val1));
          }
          ops.push(ch);
        } else {
          throw new Error("Invalid character: " + ch);
        }
        i++;
      }

      while (ops.length) {
        const op = ops.pop();
        const val2 = values.pop();
        const val1 = values.pop();
        values.push(applyOp(op, val2, val1));
      }

      if (values.length !== 1) {
        throw new Error("Invalid expression");
      }

      const result = values[0];
      return Number.isFinite(result) ? parseFloat(result.toFixed(8)) : result;
    }
  </script>
</body>
</html>
